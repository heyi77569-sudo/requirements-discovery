# Tier 2 — 中文上下文依赖短语。命中后需额外佐证才成立。
#
# 对应 en/tier2.yaml 的语义分类,但按中文的实际表达写:
#   决策临界点 / 价格犹豫 / 寻求推荐 / 挫折表达 / 群体确认 / 轻微不满
#
# 这些短语单独看可能只是一句闲聊,必须配合 price_signals.yaml
# 或 ¥/数字金额佐证才判定为候选。
phrases:
  # --- 决策临界点 ---
  - "该选哪个"
  - "选哪个好"
  - "哪个好"
  - "怎么选"
  - "如何选择"
  - "求建议"
  - "求推荐"
  - "求推荐工具"
  - "求个工具"
  - "求软件"
  - "有没有推荐"
  - "有什么推荐"
  - "帮我推荐"
  - "求个方案"
  - "求教程"
  - "怎么办"
  - "怎么处理"
  - "如何解决"
  - "求解决"
  - "求方法"

  # --- 价格犹豫 ---
  - "值不值"
  - "值这个价吗"
  - "值得吗"
  - "有必要买吗"
  - "有必要吗"
  - "该不该"
  - "是不是太"
  - "会不会太贵"
  - "会不会被坑"
  - "正常价格"
  - "一般多少钱"
  - "大概什么价"
  - "什么价位合适"
  - "算贵吗"
  - "算便宜吗"
  - "算划算吗"
  - "划算吗"

  # --- 寻求替代 ---
  - "有没有更好的"
  - "有更好的"
  - "更好的方案"
  - "换个牌子"
  - "买什么牌子"
  - "选哪个牌子"
  - "求个替代"
  - "有没有平替"
  - "平替"
  - "类似"
  - "有没有类似"
  - "替代方案"
  - "别的办法"
  - "还有别的办法"

  # --- 找工具(中文最高频的求助句式之一)---
  - "想找个"
  - "想找一款"
  - "找个软件"
  - "找个工具"
  - "找款软件"
  - "找什么软件"
