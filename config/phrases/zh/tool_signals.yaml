# 工具 / 载体信号 — Tier 2 的第二类佐证(与 price_signals 并列,任一命中即可)。
#
# 参考实现的注释写的是 "need dollar/tool signal to qualify",
# 但实际只实现了 dollar 一半 —— PRICE_SIGNALS 全是价格词,没有工具词。
# 这里补上另一半:提到"某个软件/工具/服务"本身就是需求上下文,
# 因为用户不会为一个不存在的工具发问。
#
# 命中任一条即视为「这条内容指向一个具体的工具/载体」。
