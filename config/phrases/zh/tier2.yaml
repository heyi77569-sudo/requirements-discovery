  - "求一款"
  - "求一个软件"
  - "求一个工具"
  - "求个网站"
  - "求个app"
  - "有没有能"
  - "有没有那种"
  - "有没有什么软件"
  - "有没有什么工具"
  - "有没有好用的"
  - "有什么好用的"
  - "有没有免费"
  - "有没有免费的"

  # --- 挫折与不满 ---
  - "不太满意"
  - "有点失望"
  - "感觉一般"
  - "不太行"
  - "不怎么样"
  - "体验一般"
